<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XPSimulator new tab</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="xp-popup-body">
  <div class="xp-popup-window">
    <div class="xp-popup-titlebar">
      <span>XPSimulator new tab</span>
    </div>

    <div class="xp-popup-content">
      <div class="xp-switch-row">
        <span class="xp-switch-label">Open links in internet explorer</span>
        <div class="switch">
          <input role="switch" type="checkbox" class="switch-input" id="switch-open-ie" checked />
          <label class="switch-input-label" for="switch-open-ie"></label>
        </div>
      </div>

      <div class="xp-switch-row">
        <span class="xp-switch-label">Enable Google Overlay HUD</span>
        <div class="switch">
          <input role="switch" type="checkbox" class="switch-input" id="check-overlay-master" checked />
          <label class="switch-input-label" for="check-overlay-master"></label>
        </div>
      </div>

      <div class="xp-switch-row">
        <span class="xp-switch-label">Apply Old Google in real browser</span>
        <div class="switch">
          <input role="switch" type="checkbox" class="switch-input" id="check-old-google-real" />
          <label class="switch-input-label" for="check-old-google-real"></label>
        </div>
      </div>

      <div class="xp-switch-row">
        <span class="xp-switch-label">Apply Old YouTube in real browser</span>
        <div class="switch">
          <input role="switch" type="checkbox" class="switch-input" id="check-old-youtube-real" />
          <label class="switch-input-label" for="check-old-youtube-real"></label>
        </div>
      </div>

      <div class="xp-switch-row">
        <span class="xp-switch-label">Single click to open</span>
        <div class="switch">
          <input role="switch" type="checkbox" class="switch-input" id="check-single-click" />
          <label class="switch-input-label" for="check-single-click"></label>
        </div>
      </div>

      <div class="xp-switch-row">
        <span class="xp-switch-label">Keep TABs Open</span>
        <div class="switch">
          <input role="switch" type="checkbox" class="switch-input" id="check-keep-windows" />
          <label class="switch-input-label" for="check-keep-windows"></label>
        </div>
      </div>

      <div class="xp-slider-row" style="margin-top: 6px; padding: 2px 0;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
          <span class="xp-switch-label">Website Brightness:</span>
          <span id="brightness-val-label" style="font-size: 11px; font-weight: bold; min-width: 24px; text-align: right;">0</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 13px; font-weight: bold; color: #444;">-</span>
          <input type="range" id="slider-brightness" min="-50" max="50" value="0" step="1" style="flex: 1; accent-color: #245edb; cursor: pointer;" />
          <span style="font-size: 13px; font-weight: bold; color: #444;">+</span>
        </div>
      </div>

      <div class="xp-switch-row" style="margin-top: 4px;">
        <span class="xp-switch-label">Exclude Google UI from brightness</span>
        <div class="switch">
          <input role="switch" type="checkbox" class="switch-input" id="check-exclude-google-ui" checked />
          <label class="switch-input-label" for="check-exclude-google-ui"></label>
        </div>
      </div>

      <div class="xp-action-row" style="margin-top: 6px;">
        <button id="btn-import-bookmarks" class="xp-xp-btn" style="width: 100%;" type="button">
          Import Bookmarks
        </button>
      </div>
      <div id="bookmark-status-msg" class="xp-status-msg"></div>

      <div class="xp-action-row" style="margin-top: 4px;">
        <button id="btn-import-shortcuts" class="xp-xp-btn" style="width: 100%;" type="button">
          Import Shortcuts
        </button>
      </div>
      <div id="shortcut-status-msg" class="xp-status-msg"></div>



      <div class="xp-section-label" style="margin-top: 8px;">Meme Pack:</div>
      <div class="xp-switch-row">
        <span class="xp-switch-label">Enable Meme Pack 1</span>
        <div class="switch">
          <input role="switch" type="checkbox" class="switch-input" id="check-meme-pack" />
          <label class="switch-input-label" for="check-meme-pack"></label>
        </div>
      </div>

      <div class="xp-section-label" style="margin-top: 8px;">Redirection URL:</div>
      <div class="xp-input-group">
        <input type="text" id="input-simulator-url" class="xp-input" spellcheck="false" placeholder="https://xpsimulator.com" />
      </div>

      <div class="xp-btn-row" style="margin-top: 8px; justify-content: space-between; align-items: center;">
        <button id="btn-github-repo" class="xp-xp-btn" type="button" title="View Source on GitHub" style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px;">
          <svg height="12" width="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
          </svg>
          <span>GitHub</span>
        </button>
        <div style="display: flex; gap: 6px;">
          <button id="btn-save-url" class="xp-xp-btn xp-xp-btn-primary">Apply</button>
          <button id="btn-reset-url" class="xp-xp-btn">Reset</button>
        </div>
      </div>
      <div id="status-msg" class="xp-status-msg"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
